<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 DIAGNÓSTICO - Cristalito</title>
    
    <!-- ARQUIVOS DO CRISTALITO -->
    <link rel="stylesheet" href="css/cristalito.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1a202c;
            color: #e2e8f0;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #2d3748;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { color: #63b3ed; margin-bottom: 1rem; }
        h2 { color: #48bb78; margin: 1.5rem 0 0.5rem 0; font-size: 1.2rem; }
        .status { padding: 0.5rem 1rem; margin: 0.5rem 0; border-radius: 0.5rem; }
        .ok { background: #276749; border-left: 4px solid #48bb78; }
        .error { background: #742a2a; border-left: 4px solid #fc8181; }
        .warning { background: #744210; border-left: 4px solid #f6ad55; }
        .info { background: #1e3a8a; border-left: 4px solid #63b3ed; }
        code {
            background: #1a202c;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            color: #f6ad55;
        }
        pre {
            background: #1a202c;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }
        button:hover { background: #2c5282; }
        #resultado { margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 DIAGNÓSTICO DO CRISTALITO</h1>
        <p>Este diagnóstico vai verificar TODOS os arquivos e configurações.</p>
        
        <div id="resultado">
            <div class="info status">⏳ Iniciando diagnóstico...</div>
        </div>
        
        <button onclick="executarDiagnostico()">🔍 Executar Diagnóstico</button>
        <button onclick="forcarCristalito()">💪 Forçar Carregar Cristalito</button>
    </div>

    <!-- CARREGAR CRISTALITO -->
    <script src="js/cristalito.js"></script>
    
    <!-- SCRIPT DE DIAGNÓSTICO -->
    <script>
        function executarDiagnostico() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = '<div class="info status">🔍 Executando diagnóstico...</div>';
            
            let html = '';
            let problemas = 0;
            
            // 1. Verificar URL atual
            html += '<h2>1️⃣ URL e Caminho</h2>';
            html += `<div class="info status">URL: <code>${window.location.href}</code></div>`;
            html += `<div class="info status">Pathname: <code>${window.location.pathname}</code></div>`;
            
            // 2. Verificar se CSS foi carregado
            html += '<h2>2️⃣ Arquivo CSS</h2>';
            const cssLinks = document.querySelectorAll('link[href*="cristalito"]');
            if (cssLinks.length > 0) {
                html += `<div class="ok status">✅ CSS encontrado: <code>${cssLinks[0].href}</code></div>`;
            } else {
                html += '<div class="error status">❌ CSS do Cristalito NÃO encontrado!</div>';
                problemas++;
            }
            
            // 3. Verificar se JS foi carregado
            html += '<h2>3️⃣ Arquivo JavaScript</h2>';
            const jsScripts = document.querySelectorAll('script[src*="cristalito"]');
            if (jsScripts.length > 0) {
                html += `<div class="ok status">✅ JS encontrado: <code>${jsScripts[0].src}</code></div>`;
            } else {
                html += '<div class="error status">❌ JS do Cristalito NÃO encontrado!</div>';
                problemas++;
            }
            
            // 4. Verificar se Cristalito foi inicializado
            html += '<h2>4️⃣ Inicialização</h2>';
            if (typeof Cristalito !== 'undefined') {
                html += '<div class="ok status">✅ Classe Cristalito existe</div>';
            } else {
                html += '<div class="error status">❌ Classe Cristalito NÃO existe!</div>';
                problemas++;
            }
            
            if (typeof cristalito !== 'undefined' && cristalito) {
                html += '<div class="ok status">✅ Cristalito foi inicializado</div>';
            } else {
                html += '<div class="error status">❌ Cristalito NÃO foi inicializado!</div>';
                problemas++;
            }
            
            // 5. Verificar elementos no DOM
            html += '<h2>5️⃣ Elementos no DOM</h2>';
            const button = document.getElementById('cristalito-button');
            const panel = document.getElementById('cristalito-panel');
            const overlay = document.getElementById('cristalito-overlay');
            
            if (button) {
                html += '<div class="ok status">✅ Botão flutuante existe</div>';
                html += `<div class="info status">Posição: <code>${getComputedStyle(button).position}</code></div>`;
                html += `<div class="info status">Bottom: <code>${getComputedStyle(button).bottom}</code></div>`;
                html += `<div class="info status">Left: <code>${getComputedStyle(button).left}</code></div>`;
                html += `<div class="info status">Z-index: <code>${getComputedStyle(button).zIndex}</code></div>`;
                html += `<div class="info status">Display: <code>${getComputedStyle(button).display}</code></div>`;
                html += `<div class="info status">Visibility: <code>${getComputedStyle(button).visibility}</code></div>`;
            } else {
                html += '<div class="error status">❌ Botão flutuante NÃO existe no DOM!</div>';
                problemas++;
            }
            
            if (panel) {
                html += '<div class="ok status">✅ Painel lateral existe</div>';
            } else {
                html += '<div class="error status">❌ Painel lateral NÃO existe!</div>';
                problemas++;
            }
            
            if (overlay) {
                html += '<div class="ok status">✅ Overlay existe</div>';
            } else {
                html += '<div class="error status">❌ Overlay NÃO existe!</div>';
                problemas++;
            }
            
            // 6. Verificar imagens
            html += '<h2>6️⃣ Imagens</h2>';
            if (button) {
                const img = button.querySelector('img');
                if (img) {
                    html += `<div class="ok status">✅ Imagem encontrada: <code>${img.src}</code></div>`;
                    
                    // Tentar carregar imagem
                    const testImg = new Image();
                    testImg.onload = function() {
                        document.getElementById('img-result').innerHTML = '<div class="ok status">✅ Imagem carregou com sucesso!</div>';
                    };
                    testImg.onerror = function() {
                        document.getElementById('img-result').innerHTML = '<div class="error status">❌ ERRO: Imagem não pode ser carregada! Verifique se existe em: assets/cristalito-duvida.png</div>';
                    };
                    testImg.src = img.src;
                    html += '<div id="img-result" class="info status">⏳ Testando carregamento...</div>';
                } else {
                    html += '<div class="error status">❌ Tag IMG não encontrada dentro do botão!</div>';
                    problemas++;
                }
            }
            
            // RESUMO
            html += '<h2>📊 RESUMO</h2>';
            if (problemas === 0) {
                html += '<div class="ok status">✅ TUDO FUNCIONANDO! O Cristalito deveria estar visível!</div>';
                html += '<div class="warning status">Se mesmo assim não aparece, limpe o cache: Ctrl+Shift+R</div>';
            } else {
                html += `<div class="error status">❌ ${problemas} PROBLEMA(S) ENCONTRADO(S)!</div>`;
                html += '<div class="warning status">Verifique os erros acima e corrija os arquivos.</div>';
            }
            
            resultado.innerHTML = html;
        }
        
        function forcarCristalito() {
            if (typeof Cristalito !== 'undefined') {
                if (!cristalito) {
                    cristalito = new Cristalito();
                    alert('✅ Cristalito forçado a carregar!');
                } else {
                    alert('ℹ️ Cristalito já está carregado!');
                }
            } else {
                alert('❌ ERRO: Classe Cristalito não existe! O arquivo cristalito.js não foi carregado.');
            }
        }
        
        // Executar automaticamente após 1 segundo
        setTimeout(executarDiagnostico, 1000);
    </script>
</body>
</html>
