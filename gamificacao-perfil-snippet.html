<!-- ============================================
     JAVASCRIPT PARA A ABA DE CONQUISTAS
     Adicionar no final do arquivo, antes do </body>
     ============================================ -->

<script>
// Função para carregar dados de gamificação
function carregarConquistas() {
    const usuario = verificarLogin();
    if (!usuario || typeof gamificacao === 'undefined') return;
    
    const dados = gamificacao.obterDadosUsuario(usuario.id);
    const posicao = gamificacao.obterPosicaoUsuario(usuario.id);
    const streak = gamificacao.obterStreak(usuario.id);
    const badgesUsuario = gamificacao.obterBadgesUsuario(usuario.id);
    const todasBadges = gamificacao.definirBadges();
    
    // Atualizar resumo
    document.getElementById('total-pontos').textContent = dados.pontosTotais.toLocaleString('pt-BR');
    document.getElementById('posicao-ranking').textContent = posicao ? `#${posicao}` : '-';
    document.getElementById('streak-dias').textContent = streak;
    document.getElementById('total-badges').textContent = badgesUsuario.length;
    
    // Renderizar badges conquistadas
    const badgesConquistadasDiv = document.getElementById('badges-conquistadas');
    const emptyBadges = document.getElementById('empty-badges');
    
    if (badgesUsuario.length === 0) {
        badgesConquistadasDiv.classList.add('hidden');
        emptyBadges.classList.remove('hidden');
    } else {
        badgesConquistadasDiv.classList.remove('hidden');
        emptyBadges.classList.add('hidden');
        badgesConquistadasDiv.innerHTML = badgesUsuario.map(badge => `
            <div class="bg-gradient-to-br from-primary to-primary-dark text-white rounded-lg p-4 text-center transform hover:scale-105 transition-transform">
                <div class="mb-2">${gamificacao.getIconeSVG(badge.icone, 'white', 48)}</div>
                <h4 class="font-bold mb-1">${badge.nome}</h4>
                <p class="text-xs opacity-90">${badge.descricao}</p>
            </div>
        `).join('');
    }
    
    // Renderizar badges bloqueadas
    const badgesBloqueadas = todasBadges.filter(b => !dados.badges.includes(b.id));
    document.getElementById('badges-bloqueadas').innerHTML = badgesBloqueadas.map(badge => `
        <div class="bg-gray-100 rounded-lg p-4 text-center opacity-60">
            <div class="mb-2 grayscale">${gamificacao.getIconeSVG(badge.icone, '#9CA3AF', 48)}</div>
            <h4 class="font-bold text-gray-700 mb-1">${badge.nome}</h4>
            <p class="text-xs text-gray-600">${badge.descricao}</p>
        </div>
    `).join('');
    
    // Histórico (últimos 10)
    const historico = dados.historico.slice(-10).reverse();
    document.getElementById('historico-pontos').innerHTML = historico.map(item => {
        const data = new Date(item.data);
        const nomes = {
            'aulaCompleta': 'Aula Completa',
            'quizAprovado': 'Quiz Aprovado',
            'quizPerfeito': 'Quiz Perfeito',
            'cursoCompleto': 'Curso Concluído',
            'certificadoEmitido': 'Certificado Emitido',
            'streakDiario': 'Streak Diário'
        };
        
        return `
            <div class="px-6 py-4 hover:bg-gray-50">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-semibold text-gray-900">${nomes[item.tipo]}</div>
                        <div class="text-sm text-gray-600">${data.toLocaleDateString('pt-BR')} às ${data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                    <div class="text-xl font-bold text-primary">+${item.pontos}</div>
                </div>
            </div>
        `;
    }).join('') || '<div class="p-8 text-center text-gray-500">Nenhuma atividade recente</div>';
}

// Carregar quando abrir a aba
document.addEventListener('DOMContentLoaded', function() {
    const tabConquistas = document.getElementById('tab-conquistas');
    if (tabConquistas) {
        tabConquistas.addEventListener('click', carregarConquistas);
    }
});
</script>
