<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universidade Cristal Sete</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .login-wrapper {
            display: flex;
            height: 100vh;
        }
        
        /* LADO ESQUERDO - AZUL COM FORMULÁRIO */
        .login-left {
            flex: 0 0 45%;
            background: linear-gradient(135deg, #2B5FA6 0%, #1e4378 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }
        
        .login-left::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
        }
        
        .login-content {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .logo-container {
            margin-bottom: 50px;
        }
        
        .logo-container img {
            height: 60px;
            margin-bottom: 20px;
        }
        
        .logo-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .welcome-text h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }
        
        .welcome-text p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
        }
        
        /* FORMULÁRIO */
        .form-group {
            margin-bottom: 25px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 16px;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            color: #1f2937;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        
        .form-input::placeholder {
            color: #9ca3af;
        }
        
        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }
        
        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }
        
        .password-toggle:hover {
            color: #2B5FA6;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #60a5fa;
        }
        
        .checkbox-wrapper label {
            color: white;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        
        .forgot-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .forgot-link:hover {
            color: #93c5fd;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: #60a5fa;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-login:hover {
            background: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(96, 165, 250, 0.3);
        }
        
        .btn-login:disabled {
            background: #6b7280;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 35px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider span {
            color: rgba(255, 255, 255, 0.6);
            padding: 0 15px;
            font-size: 13px;
        }
        
        .footer-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .footer-text i {
            font-size: 20px;
            color: #60a5fa;
        }
        
        .footer-text p {
            margin: 0;
            line-height: 1.5;
        }
        
        .footer-text strong {
            color: white;
            display: block;
            margin-top: 2px;
        }
        
        /* LADO DIREITO - FOTO */
        .login-right {
            flex: 1;
            background-image: url('assets/equipe-treinamento.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .login-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(43, 95, 166, 0.1) 0%, rgba(30, 67, 120, 0.2) 100%);
        }
        
        /* RESPONSIVO */
        @media (max-width: 1024px) {
            .login-left {
                flex: 0 0 50%;
                padding: 40px;
            }
        }
        
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            
            .login-left {
                flex: 1;
                padding: 30px 20px;
            }
            
            .login-right {
                display: none;
            }
            
            .welcome-text h1 {
                font-size: 28px;
            }
        }
        
        /* ANIMAÇÃO DE ENTRADA */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-content {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    
    <div class="login-wrapper">
        <!-- LADO ESQUERDO - FORMULÁRIO -->
        <div class="login-left">
            <div class="login-content">
                <!-- Logo -->
                <div class="logo-container">
                    <img src="assets/logos/universidade.png" alt="Universidade Cristal Sete">
                    <div class="logo-subtitle">VIDROS DE SEGURANÇA</div>
                </div>
                
                <!-- Welcome -->
                <div class="welcome-text">
                    <h1>Bem-vindo!</h1>
                    <p>Faça login para continuar</p>
                </div>
                
                <!-- Formulário -->
                <form id="login-form" onsubmit="handleLogin(event)">
                    <!-- Usuário -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input 
                                type="email" 
                                id="email"
                                class="form-input" 
                                placeholder="Usuário"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>
                    
                    <!-- Senha -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="senha"
                                class="form-input" 
                                placeholder="Senha"
                                required
                                autocomplete="current-password"
                            >
                            <i class="fas fa-eye password-toggle" onclick="togglePassword()"></i>
                        </div>
                    </div>
                    
                    <!-- Opções -->
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="lembrar" name="lembrar">
                            <label for="lembrar">Lembrar-me</label>
                        </div>
                        <a href="#" class="forgot-link" onclick="mostrarRecuperarSenha(); return false;">
                            Esqueceu sua senha?
                        </a>
                    </div>
                    
                    <!-- Botão -->
                    <button type="submit" class="btn-login" id="btn-entrar">
                        Entrar
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="divider">
                    <span>ou</span>
                </div>
                
                <!-- Footer -->
                <div class="footer-text">
                    <i class="fas fa-graduation-cap"></i>
                    <p>
                        <strong>Aprenda. Evolua. Cresça.</strong>
                        Conhecimento que transforma resultados.
                    </p>
                </div>
            </div>
        </div>
        
        <!-- LADO DIREITO - FOTO -->
        <div class="login-right"></div>
    </div>
    
    <!-- Scripts -->
    <script src="js/users-data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Verificar se já está logado
        window.addEventListener('DOMContentLoaded', function() {
            const usuario = verificarLogin();
            if (usuario) {
                window.location.href = 'index.html';
            }
        });
        
        // Toggle password visibility
        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const toggleIcon = document.querySelector('.password-toggle');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                senhaInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const lembrar = document.getElementById('lembrar').checked;
            const btnEntrar = document.getElementById('btn-entrar');
            
            if (!email || !senha) {
                alert('Por favor, preencha todos os campos');
                return;
            }
            
            btnEntrar.disabled = true;
            btnEntrar.textContent = 'Entrando...';
            
            setTimeout(() => {
                const resultado = fazerLogin(email, senha, lembrar);
                if (resultado.sucesso) {
                    window.location.href = 'index.html';
                } else {
                    alert(resultado.erro);
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = 'Entrar';
                }
            }, 500);
        }
        
        // Recuperar senha
        function mostrarRecuperarSenha() {
            alert('Para recuperar sua senha, entre em contato com o departamento de RH:\n\nrh@cristalsete.com.br\nTelefone: (XX) XXXX-XXXX');
        }
    </script>
</body>
</html>
