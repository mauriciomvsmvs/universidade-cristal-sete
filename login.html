<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universidade Cristal Sete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('assets/empresa-fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 2rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-field {
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: all 0.3s;
            color: #1f2937;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #2B5FA6;
            box-shadow: 0 0 0 3px rgba(43, 95, 166, 0.1);
        }
        
        .btn-login {
            background: #2B5FA6;
            color: white;
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn-login:hover {
            background: #1e4378;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 95, 166, 0.3);
        }
        
        .btn-login:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border-left: 4px solid #dc2626;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        @media (max-width: 768px) {
            .login-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    
    <div class="login-container">
        <div class="login-card">
            <!-- Header com Logo -->
            <div class="p-8 text-center" style="background: rgba(43, 95, 166, 0.15); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); border-bottom: 1px solid rgba(255, 255, 255, 0.3);">
                <div class="bg-white/95 rounded-full w-28 h-28 mx-auto mb-4 p-4 shadow-xl backdrop-blur-sm">
                    <img src="assets/logos/universidade.png" alt="Universidade Cristal Sete" class="w-full h-full object-contain">
                </div>
                <h1 class="text-2xl font-bold text-white" style="font-family: 'Montserrat', sans-serif; text-shadow: 0 3px 15px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.5);">
                    Universidade Cristal Sete
                </h1>
                <p class="text-white text-sm mt-2 font-medium" style="text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.4);">Conhecimento com Propósito</p>
            </div>
            
            <!-- Formulário -->
            <div class="p-8" style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%);">
                <h2 class="text-2xl font-bold mb-2" style="color: white; text-shadow: 0 3px 15px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.6);">Bem-vindo de volta!</h2>
                <p class="mb-6 font-medium" style="color: rgba(255,255,255,0.95); text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.5);">Entre com suas credenciais para acessar a plataforma</p>
                
                <!-- Mensagem de Erro -->
                <div id="error-message" class="error-message">
                    <strong>Erro:</strong> <span id="error-text"></span>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)">
                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-bold mb-2" style="color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);">
                            Email
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            class="input-field" 
                            placeholder="seu.email@cristalsete.com.br"
                            required
                            autocomplete="email"
                        >
                    </div>
                    
                    <!-- Senha -->
                    <div class="mb-4">
                        <label for="senha" class="block text-sm font-bold mb-2" style="color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);">
                            Senha
                        </label>
                        <input 
                            type="password" 
                            id="senha" 
                            name="senha"
                            class="input-field" 
                            placeholder="Digite sua senha"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <!-- Lembrar-me -->
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center">
                            <input 
                                type="checkbox" 
                                id="lembrar" 
                                name="lembrar"
                                class="w-4 h-4 text-[#2B5FA6] border-gray-300 rounded focus:ring-[#2B5FA6]"
                            >
                            <span class="ml-2 text-sm font-semibold" style="color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);">Lembrar-me</span>
                        </label>
                        
                        <a href="#" class="text-sm font-semibold hover:underline" style="color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);" onclick="mostrarRecuperarSenha(); return false;">
                            Esqueci minha senha
                        </a>
                    </div>
                    
                    <!-- Botão Entrar -->
                    <button type="submit" class="btn-login" id="btn-entrar">
                        Entrar
                    </button>
                </form>
                
                <!-- Info adicional -->
                <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                    <p class="text-sm font-medium" style="color: rgba(255,255,255,0.95); text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);">
                        Problemas para acessar? Entre em contato com o RH
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/users-data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Verificar se já está logado
        window.addEventListener('DOMContentLoaded', function() {
            const usuario = verificarLogin();
            if (usuario) {
                const paginaAnterior = sessionStorage.getItem('paginaAnterior');
                if (paginaAnterior && paginaAnterior !== '/login.html') {
                    window.location.href = paginaAnterior;
                } else {
                    window.location.href = 'index.html';
                }
            }
        });
        
        function mostrarErro(mensagem) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = mensagem;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }
        
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const lembrar = document.getElementById('lembrar').checked;
            const btnEntrar = document.getElementById('btn-entrar');
            
            if (!email || !senha) {
                mostrarErro('Por favor, preencha todos os campos');
                return;
            }
            
            btnEntrar.disabled = true;
            btnEntrar.textContent = 'Entrando...';
            
            setTimeout(() => {
                const resultado = fazerLogin(email, senha, lembrar);
                if (resultado.sucesso) {
                    const paginaAnterior = sessionStorage.getItem('paginaAnterior');
                    sessionStorage.removeItem('paginaAnterior');
                    if (paginaAnterior && paginaAnterior !== '/login.html') {
                        window.location.href = paginaAnterior;
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    mostrarErro(resultado.erro);
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = 'Entrar';
                }
            }, 500);
        }
        
        function mostrarRecuperarSenha() {
            alert('Para recuperar sua senha, entre em contato com o departamento de RH:\n\nrh@cristalsete.com.br\nTelefone: (XX) XXXX-XXXX');
        }
    </script>
</body>
</html>
