<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Aula - Universidade Cristal Sete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/player.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-inter bg-gray-900">
    
    <!-- HEADER SIMPLIFICADO -->
    <header class="bg-gray-800 shadow-lg">
        <nav class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <!-- Logo e Título do Curso -->
                <div class="flex items-center space-x-4">
                    <a href="cursos.html" class="text-white hover:text-gray-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <div>
                        <h1 id="curso-titulo" class="text-white font-semibold text-lg">Carregando...</h1>
                        <p id="aula-titulo-header" class="text-gray-400 text-sm">Carregando aula...</p>
                    </div>
                </div>
                
                <!-- Progresso -->
                <div class="hidden md:flex items-center space-x-4">
                    <div class="text-right">
                        <div class="text-white text-sm font-medium"><span id="progresso-percentual">0</span>% Concluído</div>
                        <div class="w-48 h-2 bg-gray-700 rounded-full mt-1 overflow-hidden">
                            <div id="progresso-barra" class="h-full bg-primary transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                    <a href="meu-perfil.html" class="text-white hover:text-gray-300">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <div class="flex h-[calc(100vh-64px)]">
        
        <!-- ÁREA DE CONTEÚDO (PLAYER) -->
        <div class="flex-1 flex flex-col">
            
            <!-- Player de Vídeo / Slide / Quiz -->
            <div id="player-container" class="flex-1 bg-black flex items-center justify-center">
                
                <!-- VÍDEO -->
                <div id="video-player" class="hidden w-full h-full">
                    <iframe id="video-iframe" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                
                <!-- SLIDES -->
                <div id="slide-player" class="hidden w-full h-full">
                    <iframe id="slide-iframe" class="w-full h-full" frameborder="0"></iframe>
                </div>
                
                <!-- QUIZ MODERNO -->
                <div id="quiz-player" class="hidden quiz-wrapper-modern">
                    <div id="quiz-container">
                        <!-- Preenchido pelo JavaScript quiz-modern.js -->
                    </div>
                    
                    <div id="quiz-resultado" class="hidden">
                        <!-- Resultado preenchido pelo JavaScript -->
                    </div>
                </div>
                
                <!-- LOADING -->
                <div id="loading-player" class="text-white text-center">
                    <svg class="animate-spin h-12 w-12 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p>Carregando conteúdo...</p>
                </div>
                
            </div>
            
            <!-- Controles de Navegação -->
            <div class="bg-gray-800 px-6 py-4 border-t border-gray-700">
                <div class="flex items-center justify-between">
                    <button id="btn-anterior" onclick="aulaAnterior()" class="flex items-center space-x-2 text-white hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span>Aula Anterior</span>
                    </button>
                    
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center space-x-2 text-white cursor-pointer">
                            <input type="checkbox" id="checkbox-concluida" onchange="marcarComoConcluida()" class="w-5 h-5 text-primary rounded focus:ring-primary">
                            <span>Marcar como concluída</span>
                        </label>
                    </div>
                    
                    <button id="btn-proxima" onclick="proximaAula()" class="flex items-center space-x-2 text-white hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <span>Próxima Aula</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
        </div>
        
        <!-- SIDEBAR - LISTA DE AULAS -->
        <div id="sidebar" class="w-80 bg-gray-800 overflow-y-auto border-l border-gray-700 hidden lg:block">
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-white font-semibold text-lg">Conteúdo do Curso</h2>
            </div>
            
            <div id="modulos-lista" class="divide-y divide-gray-700">
                <!-- Preenchido pelo JavaScript -->
            </div>
        </div>
        
        <!-- Botão Mobile para Abrir Sidebar -->
        <button id="btn-toggle-sidebar" class="lg:hidden fixed bottom-6 right-6 bg-primary text-white p-4 rounded-full shadow-lg z-50 hover:scale-110 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/navigation.js"></script>
    <script src="js/cursos-data.js"></script>
    <script src="js/player.js"></script>
    <script src="js/quiz-modern.js"></script>
    <script src="js/progress.js"></script>
    
    <script>
        // VARIÁVEIS GLOBAIS
        let cursoAtual = null;
        let moduloAtual = 1;
        let aulaAtual = 1;
        
        // INICIALIZAÇÃO
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const cursoId = parseInt(urlParams.get('cursoId'));
            moduloAtual = parseInt(urlParams.get('modulo')) || 1;
            aulaAtual = parseInt(urlParams.get('aula')) || 1;
            
            cursoAtual = cursos.find(c => c.id === cursoId);
            
            if (!cursoAtual) {
                alert('Curso não encontrado!');
                window.location.href = 'cursos.html';
                return;
            }
            
            // Atualizar título do curso
            document.getElementById('curso-titulo').textContent = cursoAtual.titulo;
            
            // Renderizar lista de módulos
            renderizarModulos();
            
            // Carregar aula atual
            carregarAula();
            
            // Atualizar progresso
            atualizarProgresso();
        }
        
        // RENDERIZAR MÓDULOS NA SIDEBAR
        function renderizarModulos() {
            const container = document.getElementById('modulos-lista');
            
            const html = cursoAtual.modulos.map(modulo => `
                <div class="modulo-section">
                    <div class="px-4 py-3 bg-gray-750">
                        <h3 class="text-white font-medium">Módulo ${modulo.numero}: ${modulo.titulo}</h3>
                        <p class="text-gray-400 text-sm">${modulo.aulas.length} aulas</p>
                    </div>
                    <div class="divide-y divide-gray-700">
                        ${modulo.aulas.map((aula, index) => {
                            const aulaNum = index + 1;
                            const isAtual = modulo.numero === moduloAtual && aulaNum === aulaAtual;
                            const isConcluida = verificarAulaConcluida(modulo.numero, aulaNum);
                            
                            return `
                                <div onclick="navegarParaAula(${modulo.numero}, ${aulaNum})" 
                                     class="px-4 py-3 cursor-pointer hover:bg-gray-700 transition-colors ${isAtual ? 'bg-gray-700 border-l-4 border-primary' : ''}">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3 flex-1">
                                            ${getAulaIconSidebar(aula.tipo)}
                                            <div class="flex-1">
                                                <div class="text-white text-sm ${isAtual ? 'font-semibold' : ''}">${aula.titulo}</div>
                                                ${aula.duracao ? `<div class="text-gray-400 text-xs">${aula.duracao}</div>` : ''}
                                            </div>
                                        </div>
                                        ${isConcluida ? `
                                            <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                            </svg>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        function getAulaIconSidebar(tipo) {
            const icons = {
                'video': '<svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"></path></svg>',
                'slide': '<svg class="w-4 h-4 text-blue-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg>',
                'quiz': '<svg class="w-4 h-4 text-green-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"></path></svg>'
            };
            return icons[tipo] || icons['video'];
        }
        
        // CARREGAR AULA
        function carregarAula() {
            const modulo = cursoAtual.modulos.find(m => m.numero === moduloAtual);
            if (!modulo) return;
            
            const aula = modulo.aulas[aulaAtual - 1];
            if (!aula) return;
            
            // Atualizar título da aula no header
            document.getElementById('aula-titulo-header').textContent = `Módulo ${moduloAtual} - ${aula.titulo}`;
            
            // Ocultar todos os players
            document.getElementById('video-player').classList.add('hidden');
            document.getElementById('slide-player').classList.add('hidden');
            document.getElementById('quiz-player').classList.add('hidden');
            document.getElementById('loading-player').classList.remove('hidden');
            
            // Atualizar checkbox de conclusão
            document.getElementById('checkbox-concluida').checked = verificarAulaConcluida(moduloAtual, aulaAtual);
            
            // Carregar conteúdo baseado no tipo
            setTimeout(() => {
                document.getElementById('loading-player').classList.add('hidden');
                
                if (aula.tipo === 'video') {
                    carregarVideo(aula.url);
                } else if (aula.tipo === 'slide') {
                    carregarSlide(aula.url);
                } else if (aula.tipo === 'quiz') {
                    carregarQuiz(aula);
                }
            }, 500);
            
            // Atualizar botões de navegação
            atualizarBotoesNavegacao();
            
            // Atualizar URL
            const newUrl = `aula-player.html?cursoId=${cursoAtual.id}&modulo=${moduloAtual}&aula=${aulaAtual}`;
            window.history.pushState({}, '', newUrl);
        }
        
        function carregarVideo(url) {
            const videoPlayer = document.getElementById('video-player');
            const iframe = document.getElementById('video-iframe');
            
            // Converter URL do YouTube para embed
            let embedUrl = url;
            if (url.includes('youtube.com/watch')) {
                const videoId = url.split('v=')[1]?.split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (url.includes('vimeo.com/')) {
                const videoId = url.split('vimeo.com/')[1];
                embedUrl = `https://player.vimeo.com/video/${videoId}`;
            }
            
            iframe.src = embedUrl;
            videoPlayer.classList.remove('hidden');
        }
        
        function carregarSlide(url) {
            const slidePlayer = document.getElementById('slide-player');
            const iframe = document.getElementById('slide-iframe');
            
            // Converter URL do Google Slides para embed
            let embedUrl = url;
            if (url.includes('docs.google.com/presentation')) {
                embedUrl = url.replace('/edit', '/embed');
            }
            
            iframe.src = embedUrl;
            slidePlayer.classList.remove('hidden');
        }
        
        function carregarQuiz(aula) {
            // Usar a função do player.js que inicializa o quiz moderno
            if (typeof initQuizPlayer === 'function') {
                initQuizPlayer(aula.perguntas);
            } else {
                console.error('Função initQuizPlayer não encontrada em player.js');
                // Fallback: tentar iniciar diretamente
                document.getElementById('quiz-player').classList.remove('hidden');
                if (typeof iniciarQuiz === 'function') {
                    iniciarQuiz(aula.perguntas);
                }
            }
        }
        
        // NAVEGAÇÃO
        function navegarParaAula(modulo, aula) {
            moduloAtual = modulo;
            aulaAtual = aula;
            carregarAula();
            renderizarModulos();
            atualizarProgresso();
        }
        
        function aulaAnterior() {
            if (aulaAtual > 1) {
                aulaAtual--;
            } else if (moduloAtual > 1) {
                moduloAtual--;
                const moduloAnterior = cursoAtual.modulos.find(m => m.numero === moduloAtual);
                aulaAtual = moduloAnterior.aulas.length;
            }
            navegarParaAula(moduloAtual, aulaAtual);
        }
        
        function proximaAula() {
            const moduloObj = cursoAtual.modulos.find(m => m.numero === moduloAtual);
            
            if (aulaAtual < moduloObj.aulas.length) {
                aulaAtual++;
            } else if (moduloAtual < cursoAtual.modulos.length) {
                moduloAtual++;
                aulaAtual = 1;
            } else {
                // Curso concluído!
                alert('Parabéns! Você concluiu o curso!');
                window.location.href = `curso-detalhe.html?id=${cursoAtual.id}`;
                return;
            }
            navegarParaAula(moduloAtual, aulaAtual);
        }
        
        function atualizarBotoesNavegacao() {
            const btnAnterior = document.getElementById('btn-anterior');
            const btnProxima = document.getElementById('btn-proxima');
            
            // Desabilitar anterior se for primeira aula
            btnAnterior.disabled = (moduloAtual === 1 && aulaAtual === 1);
            
            // Desabilitar próxima se for última aula
            const ultimoModulo = cursoAtual.modulos[cursoAtual.modulos.length - 1];
            const isUltimaAula = (moduloAtual === ultimoModulo.numero && aulaAtual === ultimoModulo.aulas.length);
            btnProxima.disabled = false; // Sempre habilitado (mostra mensagem de conclusão)
        }
        
        // PROGRESSO
        function marcarComoConcluida() {
            const checkbox = document.getElementById('checkbox-concluida');
            salvarProgressoAula(cursoAtual.id, moduloAtual, aulaAtual, checkbox.checked);
            renderizarModulos();
            atualizarProgresso();
        }
        
        function atualizarProgresso() {
            const totalAulas = cursoAtual.modulos.reduce((acc, mod) => acc + mod.aulas.length, 0);
            const aulasConcluidasCount = contarAulasConcluidas();
            const percentual = Math.round((aulasConcluidasCount / totalAulas) * 100);
            
            document.getElementById('progresso-percentual').textContent = percentual;
            document.getElementById('progresso-barra').style.width = percentual + '%';
        }
        
        function contarAulasConcluidas() {
            let count = 0;
            cursoAtual.modulos.forEach(modulo => {
                modulo.aulas.forEach((aula, index) => {
                    if (verificarAulaConcluida(modulo.numero, index + 1)) {
                        count++;
                    }
                });
            });
            return count;
        }
        
        // TOGGLE SIDEBAR MOBILE
        document.getElementById('btn-toggle-sidebar').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        });
        
        // INICIAR
        document.addEventListener('DOMContentLoaded', init);
    </script>
    
    <!-- Sistema de Autenticação -->
    <script src="js/users-data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
